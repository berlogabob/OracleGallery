# Three screens now, not seven module-named tabs. Connecting, homing and zeroing are on none
# of them -- they live in the machine rail, visible from all three.
- openLink: http://127.0.0.1:8787
- extendedWaitUntil:
    visible: "THE ORACLE OPERATOR"
    timeout: 15000
- takeScreenshot: audit/current/screens-after/01_print
- tapOn: "CREATE"
- takeScreenshot: audit/current/screens-after/02_create
- tapOn: "SETUP"
- takeScreenshot: audit/current/screens-after/03_setup
- tapOn: "PRINT"
- takeScreenshot: audit/current/screens-after/04_print_again
