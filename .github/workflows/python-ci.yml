# Python CI workflow for neje_oracle
# Implements staged quality gates with baseline thresholds

name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Run coverage
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report --fail-under=74

      # The old error-count baseline (tolerated <=66) is gone: the package now
      # type-checks clean, so plain mypy is the gate.
      - name: Run mypy
        run: uv run mypy src/neje_oracle

      - name: Run ruff check
        run: uv run ruff check src/neje_oracle tests

      - name: Run ruff format check
        run: uv run ruff format --check src/neje_oracle tests

      - name: Audit dependencies
        run: uv run --with pip-audit pip-audit --strict
