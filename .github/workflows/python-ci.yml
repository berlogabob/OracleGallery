# Python CI workflow for neje_oracle
# Implements staged quality gates with baseline thresholds

name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

      # No --fail-under here on purpose: it silently overrode pyproject's ratchet, so the two
      # drifted (74 in CI against 79 in pyproject). One source of truth, in pyproject.
      - name: Run coverage
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report

      # The old error-count baseline (tolerated <=66) is gone: the package now
      # type-checks clean, so plain mypy is the gate.
      - name: Run mypy
        run: uv run mypy src/neje_oracle

      - name: Run ruff check
        run: uv run ruff check src/neje_oracle tests

      - name: Run ruff format check
        run: uv run ruff format --check src/neje_oracle tests

      # Not --strict: that also fails on dependencies pip-audit cannot resolve, and
      # neje-oracle is the local project itself, which will never be on PyPI. Plain
      # pip-audit still exits non-zero when it finds an actual advisory.
      - name: Audit dependencies
        run: uv run --with pip-audit pip-audit
