[project]
name = "neje_oracle"
version = "0.1.0"
description = "Uploader and plotter orchestration stack for the Neje Oracle exhibition system."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115.0",
  "firebase-admin>=6.7.0",
  "httpx>=0.28.0",
  "nicegui>=2.14.0",
  "pydantic>=2.9.0",
  "qrcode[pil]>=8.0",
  "svgpathtools>=1.6.1",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "coverage>=7.6.0",
  "mypy>=2.1.0",
  "radon>=6.0.1",
  "ruff>=0.8.0",
  "types-qrcode>=8.0",
  "pre-commit>=4.1.0",
]

[project.scripts]
neje-uploader = "neje_oracle.uploader_service:main"
neje-plotter = "neje_oracle.plotter_service:main"
neje-generate-sessions = "neje_oracle.session_generator:main"
neje-gui = "neje_oracle.gui_service:main"
neje-normalize-firebase-sessions = "neje_oracle.firebase_svg_normalizer:main"
neje-uploader-agent = "neje_oracle.uploader_agent_service:main"
neje-thermal-autoprint = "neje_oracle.thermal_autoprint_service:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neje_oracle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-vv"

[tool.coverage.run]
source = ["src/neje_oracle"]
omit = [
    "*/__main__.py",
    "*/test_*.py",
    "*/tests/*.py",
]

[tool.coverage.report]
fail_under = 64
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
  "E9",
  "F63",
  "F7",
  "F82",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = ["firebase_admin", "svgpathtools", "qrcode"]
ignore_missing_imports = true
