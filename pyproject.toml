[project]
name = "neje_oracle"
version = "0.1.0"
description = "Uploader and plotter orchestration stack for the Neje Oracle exhibition system."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "ezdxf>=1.4.0",
  "fastapi>=0.115.0",
  "firebase-admin>=7.0.0",
  "httpx>=0.28.0",
  "nicegui>=3.11.0",
  "numpy>=2.0",
  "pillow>=12.0",
  "qrcode[pil]>=8.0",
  "svgpathtools>=1.6.1",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "coverage>=7.6.0",
  "mypy>=2.1.0",
  "radon>=6.0.1",
  "ruff>=0.8.0",
  "types-qrcode>=8.0",
  "pre-commit>=4.1.0",
]

[project.scripts]
neje-generate-sessions = "neje_oracle.blocks.symbols.session_generator:main"
neje-gui = "neje_oracle.blocks.gui.service:main"
neje-normalize-firebase-sessions = "neje_oracle.blocks.firebase.svg_normalizer:main"
neje-uploader-agent = "neje_oracle.blocks.macmini.uploader_agent_service:main"
neje-thermal-autoprint = "neje_oracle.blocks.thermal_printer.autoprint_service:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neje_oracle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-vv"

[tool.coverage.run]
source = ["src/neje_oracle"]
omit = [
    "*/__main__.py",
    "*/test_*.py",
    "*/tests/*.py",
]

[tool.coverage.report]
# Ratchet: set to just under the current figure so coverage cannot silently erode.
# Raise it as coverage improves; never lower it to make a build pass.
# 74 -> 79: the texture node graph (blocks/imaging/texture*.py, gui/workspaces/texture.py) landed
# at 85-94% and pulled the total to 80%.
fail_under = 79
show_missing = true
skip_covered = true

[tool.ruff]
# 120 matches how this code is actually written (p95 line is 96 chars). At 88 the
# format gate rewrote 55 files and was simply never run; at 120 it is enforceable.
line-length = 120
target-version = "py312"
# TouchDesigner scripts run inside TD's own interpreter, which injects globals such as
# `absTime` and `run` that do not exist as imports. F821 there is always a false positive.
extend-exclude = ["ESP32-BTN_Printer/TouchDesigner"]

[tool.ruff.lint]
select = [
  "E4", "E7", "E9",   # pycodestyle errors (E501 left to the formatter)
  "F",                # pyflakes: unused imports/vars, undefined names
  "I",                # import sorting
  "B",                # bugbear: mutable defaults, zip without strict, ...
  "UP",               # pyupgrade
  "SIM",              # simplifiable constructs
  "C4",               # comprehension misuse
]
ignore = [
  # str+Enum -> StrEnum changes str(member) from "Class.MEMBER" to the value.
  # These enums are persisted to sqlite and JSON; the rewrite is a silent
  # data-format change for no benefit. Revisit only with a migration.
  "UP042",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = ["firebase_admin", "svgpathtools", "qrcode", "ezdxf.*"]
ignore_missing_imports = true
