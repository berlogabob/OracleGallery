<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoDraw - Generative Plotter Sketch</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    #canvas-container {
      margin-bottom: 30px;
    }
    canvas {
      display: block;
      border: 2px solid #444;
      background-color: #fff;
    }
    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 10px 20px;
      background-color: #0066cc;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0052a3;
    }
    button:active {
      background-color: #003d7a;
    }
    #status {
      font-size: 12px;
      color: #aaa;
      min-width: 200px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="controls">
    <button id="regenerate-btn">Regenerate</button>
    <button id="send-btn">Send to plotter</button>
    <span id="status">Ready</span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
