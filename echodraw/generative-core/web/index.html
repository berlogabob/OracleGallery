<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoDraw - Generative Plotter Sketch</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #f7f1e7;
      color: #1f1a17;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    #canvas-container {
      margin-bottom: 14px;
    }
    canvas {
      display: block;
      border: 1px solid #dac9ad;
      background-color: #fff;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 8px 16px;
      background-color: #fffaf0;
      color: #8f4f2b;
      border: 1px solid #dac9ad;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.2s, border-color 0.2s;
    }
    button:hover {
      background-color: #f0e2ce;
      border-color: #8f4f2b;
    }
    button:active {
      background-color: #e5d1b4;
    }
    #status {
      font-size: 12px;
      color: #6f6259;
      min-width: 200px;
      text-align: center;
    }
    .layers-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      width: 100%;
      max-width: 560px;
    }
    #layers-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .layer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      background-color: #fffaf0;
      border: 1px solid #dac9ad;
      border-radius: 10px;
      padding: 6px 10px;
    }
    .layer-row select {
      background-color: #f7f1e7;
      color: #1f1a17;
      border: 1px solid #dac9ad;
      border-radius: 999px;
      padding: 3px 5px;
      font-size: 12px;
    }
    input {
      accent-color: #8f4f2b;
    }
    .density-slider {
      width: 90px;
    }
    .mask-label {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .layer-remove-btn {
      margin-left: auto;
      padding: 2px 9px;
      font-size: 13px;
    }
    .layer-remove-btn:disabled {
      color: #9b8e83;
      background-color: #eee4d4;
      cursor: not-allowed;
    }
    #add-layer-btn {
      padding: 6px 16px;
      font-size: 13px;
    }
    #add-layer-btn:disabled {
      color: #9b8e83;
      background-color: #eee4d4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="controls">
    <button id="regenerate-btn">Regenerate</button>
    <button id="send-btn">Send to plotter</button>
    <span id="status">Ready</span>
  </div>

  <div class="layers-section">
    <div id="layers-container"></div>
    <button id="add-layer-btn" type="button">+ Add layer</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
