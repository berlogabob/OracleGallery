# FluidNC configuration — NEJE Master 2S Plus frame on MKS TinyBee V1.0 (ESP32)
#
# SOURCE OF TRUTH. Pulled from the running controller on 2026-08-07 via
# `curl http://fluidnc.local/TinyBee-06.yaml`, cross-checked against the FluidNC
# boot log (`$SS`) and a live `$CD` dump. On the board this file is named
# TinyBee-06.yaml; keep the two in sync.
#
# Do not edit from memory. If you change the machine, pull the file off the
# board again rather than hand-editing here — the previous version of this file
# was a pre-servo draft whose values would have crashed the machine (Y homing
# inverted, half scale, and the laser PWM assigned to the pen-servo pin).
#
# Verified against the physical machine 2026-08-07:
#   X travel 255 mm, Y travel 440 mm, both home NEGATIVE to mpos 0
#   steps_per_mm 40 (measured dead-on over 100 mm)
#   real limit switches on gpio.33 (X), gpio.32 (Y), gpio.22 (Z)
#   pen is an RC servo on the Z axis (gpio.2); the spindle PWM is gpio.15
#
# wifi/ credentials are NOT stored here — they live on the board only.

board: MKS TinyBee V1.0 XXYYZ
kinematics: {}
i2so:
  bck_pin: gpio.25
  data_pin: gpio.27
  ws_pin: gpio.26
spi:
  miso_pin: gpio.19
  mosi_pin: gpio.23
  sck_pin: gpio.18
sdcard:
  cs_pin: gpio.5
  card_detect_pin: gpio.34:low
stepping:
  engine: I2S_STATIC
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 2
axes:
  x:
    steps_per_mm: 40
    max_rate_mm_per_min: 8000
    acceleration_mm_per_sec2: 100
    max_travel_mm: 255
    soft_limits: true
    homing:
      cycle: 3
      positive_direction: false
      mpos_mm: 0
      feed_mm_per_min: 300
      seek_mm_per_min: 1500
      settle_ms: 500
      seek_scaler: 1.1
      feed_scaler: 1.1
    motor0:
      limit_neg_pin: gpio.33:pu:low
      hard_limits: true
      pulloff_mm: 4
      stepstick:
        step_pin: i2so.1
        direction_pin: i2so.2
        disable_pin: i2so.0
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
  y:
    steps_per_mm: 40
    max_rate_mm_per_min: 8000
    acceleration_mm_per_sec2: 100
    max_travel_mm: 440
    soft_limits: true
    homing:
      cycle: 3
      positive_direction: false
      mpos_mm: 0
      feed_mm_per_min: 300
      seek_mm_per_min: 2000
      settle_ms: 500
      seek_scaler: 1.1
      feed_scaler: 1.1
    motor0:
      limit_neg_pin: gpio.32:pu:low
      hard_limits: true
      pulloff_mm: 4
      stepstick:
        step_pin: i2so.4
        direction_pin: i2so.5
        disable_pin: i2so.3
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
  z:
    # Pen lift. NOT a leadscrew — an RC servo. Z0 = pen up, Z-25 = pen down.
    steps_per_mm: 100
    max_rate_mm_per_min: 10000
    acceleration_mm_per_sec2: 1000
    max_travel_mm: 25
    soft_limits: true
    homing:
      cycle: 1
      positive_direction: true
      mpos_mm: 0
      feed_mm_per_min: 300
      seek_mm_per_min: 500
      settle_ms: 500
      seek_scaler: 1.1
      feed_scaler: 1.1
    motor0:
      rc_servo:
        pwm_hz: 50
        output_pin: gpio.2
        min_pulse_us: 900
        max_pulse_us: 2100
      limit_neg_pin: NO_PIN
      limit_pos_pin: gpio.22:pu:low
      limit_all_pin: NO_PIN
coolant:
  flood_pin: i2so.16
  mist_pin: i2so.17
  delay_ms: 0
PWM:
  # Laser spindle. gpio.15 — NOT gpio.2, which is the pen servo.
  pwm_hz: 2500
  output_pin: gpio.15
  s0_with_disable: true
  tool_num: 0
  spinup_ms: 4000
  spindown_ms: 4000
  speed_map: 0=0.000% 12000=100.000%
  enable_pin: NO_PIN
  direction_pin: NO_PIN
start:
  must_home: true
  check_limits: true
probe:
  pin: NO_PIN
  toolsetter_pin: NO_PIN
  check_mode_start: false
  hard_stop: false
